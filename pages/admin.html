<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Braids By Fobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css?v=2026.05.28.2" />
  <style>
    .upload-row {
      display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
    }
    .upload-thumb {
      width: 72px; height: 72px; border-radius: 8px; background: #fde8f1;
      border: 1px solid var(--color-border); object-fit: cover;
      display: block; flex-shrink: 0;
    }
    .upload-status { font-size: 0.85rem; color: var(--color-muted); }
    .site-section {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 22px; margin-bottom: 18px;
    }
    .site-section h3 { margin-bottom: 14px; font-size: 1.1rem; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .testimonial-row {
      background: #fff6fa; border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px;
    }
    .testimonial-row .field { margin-bottom: 8px; }
    .small-btn {
      padding: 6px 12px; font-size: 0.82rem;
    }

    /* Action buttons for "Upload to GitHub" inside image fields */
    .repo-actions {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .repo-actions .btn { text-decoration: none; }
    .repo-actions-empty {
      color: var(--color-muted); font-size: 0.85rem;
    }

    /* Stat cards (used by Inventory + Expenses) */
    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 16px 18px;
    }
    .stat-card.warn { background: #fde8f1; border-color: #e8bdd0; }
    .stat-label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--color-muted); }
    .stat-value { font-family: var(--font-display); font-size: 1.6rem; color: var(--color-text); margin-top: 4px; }
    .stat-sub { display: block; font-size: 0.8rem; color: var(--color-muted); margin-top: 2px; }
    .stat-delta { font-size: 0.78rem; font-weight: 600; margin-top: 4px; display: inline-block; }
    .delta-up { color: var(--color-danger); }
    .delta-down { color: var(--color-success); }
    .delta-flat { color: var(--color-muted); }

    /* Toolbar (search/filter row) */
    .toolbar {
      display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;
    }
    .toolbar input[type="search"], .toolbar select {
      padding: 9px 12px; border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 0.92rem;
      background: #fff;
    }
    .toolbar input[type="search"] { min-width: 220px; }
    .inline-check {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.9rem; color: var(--color-muted);
    }

    /* Inventory qty adjust */
    .qty-adjust {
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    }
    .qty-btn {
      width: 28px; height: 28px; border: 1px solid var(--color-border);
      border-radius: 50%; background: #fff; cursor: pointer; font-weight: 700;
      color: var(--color-primary);
    }
    .qty-btn:hover:not(:disabled) { background: var(--color-bg); }
    .qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .qty-val { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
    .row-sub { color: var(--color-muted); font-size: 0.82rem; }

    /* Expense panels & forecast */
    .panel {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .panel-head h3 { margin: 0; }
    .chart-wrap { background: #fff6fa; border-radius: var(--radius-sm); padding: 10px; }
    .forecast-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      margin-top: 16px; padding: 14px; background: #fff6fa;
      border-radius: var(--radius-sm);
    }
    .row-label { font-size: 0.78rem; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .row-value { font-family: var(--font-display); font-size: 1.2rem; color: var(--color-text); }
    .muted-note { color: var(--color-muted); font-size: 0.85rem; margin: 10px 0 0; }
    .cat-list { display: flex; flex-direction: column; gap: 10px; }
    .cat-row-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; }
    .cat-row-head .muted { color: var(--color-muted); }
    .cat-bar { background: #ecd0de; height: 8px; border-radius: 4px; overflow: hidden; }
    .cat-bar-fill { background: var(--color-accent); height: 100%; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal-card { max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; margin: 0; }

    @media (max-width: 700px) {
      .row-2 { grid-template-columns: 1fr; }
      .forecast-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav-slot"></div>

  <section class="section">
    <div class="container">
      <span class="hero-eyebrow">Admin</span>
      <h1 style="margin:8px 0 18px">Dashboard</h1>

      <div class="admin-tabs">
        <button data-tab="bookings" class="active">Bookings</button>
        <button data-tab="styles">Styles</button>
        <button data-tab="availability">Availability</button>
        <button data-tab="inventory">Inventory</button>
        <button data-tab="expenses">Expenses</button>
        <button data-tab="site">Site</button>
      </div>

      <div id="tab-content">
        <div class="center-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <div id="modal-root"></div>

  <div id="footer-slot"></div>

  <script type="module">
    import { injectNav, injectFooter, requireAdmin, escapeHtml, styleImgSrc, siteImgSrc } from "../scripts/common.js";
    import {
      db, collection, getDocs, addDoc, doc, getDoc, setDoc, updateDoc, deleteDoc,
      query, orderBy, fmtMoney, fmtDate, fmtTime, fmtDuration, serverTimestamp,
      githubUploadUrl, githubBrowseUrl, uploadImageToRepo, canUploadViaFunction
    } from "../scripts/firebase-config.js";
    import { getAllStyles, invalidateStyleCache } from "../scripts/styles-data.js";
    import {
      DEFAULT_CONTENT, getSiteContent, invalidateSiteContentCache
    } from "../scripts/site-content.js";
    import { renderInventory } from "../scripts/admin-inventory.js";
    import { renderExpenses } from "../scripts/admin-expenses.js";

    injectNav("admin");
    injectFooter();
    await requireAdmin("../index.html");

    const tabContent = document.getElementById("tab-content");
    const tabsEl = document.querySelector(".admin-tabs");

    tabsEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-tab]");
      if (!btn) return;
      tabsEl.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderTab(btn.dataset.tab);
    });

    function renderTab(tab) {
      if (tab === "bookings") return renderBookings();
      if (tab === "styles") return renderStyles();
      if (tab === "availability") return renderAvailability();
      if (tab === "inventory") return renderInventory(tabContent);
      if (tab === "expenses") return renderExpenses(tabContent);
      if (tab === "site") return renderSite();
    }
    renderTab("bookings");

    // ---------- BOOKINGS ----------
    async function renderBookings() {
      tabContent.innerHTML = `<div class="center-spinner"><div class="spinner"></div></div>`;
      try {
        const q = query(collection(db, "bookings"), orderBy("startAt", "desc"));
        const snap = await getDocs(q);
        const bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!bookings.length) {
          tabContent.innerHTML = `<div class="empty-state"><h3>No bookings yet</h3></div>`;
          return;
        }
        tabContent.innerHTML = `
          <div class="table-card">
            <table class="data">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Client</th>
                  <th>Style</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${bookings.map(b => `
                  <tr data-id="${b.id}">
                    <td>
                      <strong>${fmtDate(b.startAt)}</strong><br/>
                      <span style="color:var(--color-muted);font-size:0.85rem">${fmtTime(b.startAt)} &middot; ${fmtDuration(b.durationMin || 0)}</span>
                    </td>
                    <td>
                      ${escapeHtml(b.customer?.name || "—")}<br/>
                      <span style="color:var(--color-muted);font-size:0.85rem">${escapeHtml(b.customer?.email || "")}</span>
                    </td>
                    <td>${escapeHtml(b.styleName || "")}</td>
                    <td>${fmtMoney(b.priceCents || 0)}</td>
                    <td><span class="badge badge-${escapeHtml(b.status || "pending")}">${escapeHtml(b.status || "pending")}</span></td>
                    <td>
                      <select data-action="status" style="padding:6px 8px;border:1px solid var(--color-border);border-radius:6px">
                        <option value="">Set status…</option>
                        <option value="confirmed">Confirm</option>
                        <option value="completed">Complete</option>
                        <option value="cancelled">Cancel</option>
                      </select>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
        tabContent.querySelectorAll("select[data-action='status']").forEach(sel => {
          sel.addEventListener("change", async (e) => {
            const status = e.target.value;
            if (!status) return;
            const id = e.target.closest("tr").dataset.id;
            await updateDoc(doc(db, "bookings", id), { status });
            renderBookings();
          });
        });
      } catch (err) {
        tabContent.innerHTML = `<div class="empty-state"><h3>Couldn't load bookings</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    // ---------- STYLES ----------
    async function renderStyles() {
      tabContent.innerHTML = `<div class="center-spinner"><div class="spinner"></div></div>`;
      try {
        const styles = await getAllStyles({ activeOnly: false });
        tabContent.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
            <p style="margin:0">Manage your service menu.</p>
            <button class="btn btn-primary" id="new-style">+ Add style</button>
          </div>
          <div class="table-card">
            <table class="data">
              <thead>
                <tr><th>Photo</th><th>Name</th><th>Category</th><th>Price</th><th>Duration</th><th>Active</th><th></th></tr>
              </thead>
              <tbody>
                ${styles.map(s => `
                  <tr data-id="${escapeHtml(s.id)}">
                    <td>
                      ${s.image
                        ? `<img src="${styleImgSrc(s.image)}" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover" onerror="this.style.display='none'">`
                        : `<div style="width:48px;height:48px;border-radius:8px;background:#fde8f1"></div>`}
                    </td>
                    <td><strong>${escapeHtml(s.name)}</strong><br/>
                      <span style="color:var(--color-muted);font-size:0.85rem">${escapeHtml(s.shortDesc || "")}</span>
                    </td>
                    <td>${escapeHtml(s.category || "—")}</td>
                    <td>${fmtMoney(s.priceCents || 0)}</td>
                    <td>${fmtDuration(s.durationMin || 0)}</td>
                    <td>${s.active === false ? `<span class="badge badge-cancelled">no</span>` : `<span class="badge badge-confirmed">yes</span>`}</td>
                    <td>
                      <button class="btn btn-ghost small-btn" data-action="edit">Edit</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
        document.getElementById("new-style").addEventListener("click", () => openStyleModal(null));
        tabContent.querySelectorAll("button[data-action='edit']").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.closest("tr").dataset.id;
            openStyleModal(id);
          });
        });
      } catch (err) {
        tabContent.innerHTML = `<div class="empty-state"><h3>Couldn't load styles</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    async function openStyleModal(id) {
      let existing = { name: "", category: "", priceCents: 0, depositCents: 0, durationMin: 60, image: "", shortDesc: "", description: "", featured: false, active: true };
      if (id) {
        try {
          const snap = await getDoc(doc(db, "styles", id));
          if (snap.exists()) existing = { id: snap.id, ...snap.data() };
          else {
            const all = await getAllStyles({ activeOnly: false });
            const seed = all.find(s => s.id === id);
            if (seed) existing = seed;
          }
        } catch (_) { /* fallback */ }
      }
      const modal = document.getElementById("modal-root");
      modal.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px">
          <div class="form-card" style="max-width:560px;width:100%;max-height:90vh;overflow:auto">
            <h2>${id ? "Edit style" : "New style"}</h2>
            <div id="modal-alert"></div>
            <form id="style-form">
              <div class="field"><label>Name</label><input name="name" value="${escapeHtml(existing.name)}" required></div>
              <div class="field"><label>Category</label><input name="category" value="${escapeHtml(existing.category || "")}"></div>
              <div class="row-2">
                <div class="field"><label>Price (USD)</label><input name="price" type="number" step="0.01" min="0" value="${(existing.priceCents/100).toFixed(2)}" required></div>
                <div class="field"><label>Deposit (USD)</label><input name="deposit" type="number" step="0.01" min="0" value="${((existing.depositCents||0)/100).toFixed(2)}"></div>
              </div>
              <div class="field"><label>Duration (minutes)</label><input name="duration" type="number" min="15" step="15" value="${existing.durationMin}" required></div>

              <div class="field">
                <label>Photo</label>
                <div class="upload-row">
                  <img class="upload-thumb" id="style-thumb" alt=""
                       src="${existing.image ? styleImgSrc(existing.image) : ''}"
                       style="${existing.image ? '' : 'display:none'}"
                       onerror="this.style.display='none'">
                  <div style="flex:1">
                    ${canUploadViaFunction()
                      ? `<label class="btn btn-primary" for="style-photo-input" style="text-decoration:none; cursor:pointer">
                           <span aria-hidden="true">📸</span> Choose photo
                         </label>
                         <input type="file" accept="image/*" id="style-photo-input" hidden>
                         <div class="upload-status" id="style-photo-status" style="margin-top:6px">
                           Pick a photo from your device. We compress it, commit it into <code>images/styles/</code> in the repo, and fill in the field below automatically.
                         </div>`
                      : repoButtons("images/styles")}
                    <input name="image" id="style-image-url" value="${escapeHtml(existing.image || "")}"
                      placeholder="e.g. knotless-medium.jpg" style="font-size:0.92rem; margin-top:10px">
                    <div class="upload-status">
                      ${canUploadViaFunction()
                        ? `Or type a filename / path that's already in <code>images/styles/</code>.`
                        : `After committing on GitHub, paste the filename above and click Save.`}
                    </div>
                  </div>
                </div>
              </div>

              <div class="field"><label>Short description</label><input name="shortDesc" value="${escapeHtml(existing.shortDesc || "")}"></div>
              <div class="field"><label>Full description</label><textarea name="description">${escapeHtml(existing.description || "")}</textarea></div>
              <div style="display:flex;gap:18px;margin-bottom:12px">
                <label style="display:flex;align-items:center;gap:8px;font-size:0.92rem"><input type="checkbox" name="featured" ${existing.featured ? "checked" : ""}> Featured on home</label>
                <label style="display:flex;align-items:center;gap:8px;font-size:0.92rem"><input type="checkbox" name="active" ${existing.active !== false ? "checked" : ""}> Active (bookable)</label>
              </div>
              <div style="display:flex;gap:8px;justify-content:space-between">
                ${id ? `<button type="button" class="btn btn-ghost" id="delete-btn" style="color:var(--color-danger);border-color:var(--color-danger)">Delete</button>` : `<div></div>`}
                <div style="display:flex;gap:8px">
                  <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
                  <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
      const close = () => { modal.innerHTML = ""; };
      document.getElementById("cancel-btn").addEventListener("click", close);

      const imageInput = document.getElementById("style-image-url");
      const thumb = document.getElementById("style-thumb");

      function refreshThumb() {
        const v = imageInput.value.trim();
        if (!v) { thumb.style.display = "none"; return; }
        thumb.src = styleImgSrc(v);
        thumb.style.display = "block";
      }
      imageInput.addEventListener("input", refreshThumb);

      const stylePhotoInput = document.getElementById("style-photo-input");
      if (stylePhotoInput) {
        const status = document.getElementById("style-photo-status");
        const saveBtn = document.getElementById("save-btn");
        stylePhotoInput.addEventListener("change", async () => {
          const file = stylePhotoInput.files?.[0];
          if (!file) return;
          status.textContent = "Uploading to GitHub…";
          if (saveBtn) saveBtn.disabled = true;
          try {
            const path = await uploadImageToRepo(file, "styles");
            imageInput.value = path;
            refreshThumb();
            status.innerHTML = `Committed to repo as <code>${escapeHtml(path)}</code>. GitHub Pages will republish in ~1–2 min.`;
          } catch (err) {
            status.textContent = `Upload failed: ${err.message}`;
          } finally {
            if (saveBtn) saveBtn.disabled = false;
            stylePhotoInput.value = "";
          }
        });
      }

      const form = document.getElementById("style-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {
          name: form.name.value.trim(),
          category: form.category.value.trim(),
          priceCents: Math.round(parseFloat(form.price.value) * 100),
          depositCents: Math.round(parseFloat(form.deposit.value || "0") * 100),
          durationMin: parseInt(form.duration.value, 10),
          image: form.image.value.trim(),
          shortDesc: form.shortDesc.value.trim(),
          description: form.description.value.trim(),
          featured: form.featured.checked,
          active: form.active.checked,
          updatedAt: serverTimestamp()
        };
        try {
          if (id) {
            await setDoc(doc(db, "styles", id), data, { merge: true });
          } else {
            await addDoc(collection(db, "styles"), { ...data, createdAt: serverTimestamp() });
          }
          invalidateStyleCache();
          close();
          renderStyles();
        } catch (err) {
          document.getElementById("modal-alert").innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        }
      });
      const deleteBtn = document.getElementById("delete-btn");
      if (deleteBtn) {
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("Delete this style?")) return;
          try {
            await deleteDoc(doc(db, "styles", id));
            invalidateStyleCache();
            close();
            renderStyles();
          } catch (err) {
            document.getElementById("modal-alert").innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
          }
        });
      }
    }

    // ---------- AVAILABILITY ----------
    async function renderAvailability() {
      tabContent.innerHTML = `
        <div class="form-card" style="max-width:520px;margin-left:0">
          <h2>Block a date</h2>
          <p class="sub">Mark a date closed (e.g. holiday) or set custom hours.</p>
          <div id="avail-alert"></div>
          <form id="avail-form">
            <div class="field"><label>Date</label><input name="date" type="date" required></div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
              <input type="checkbox" id="closed" name="closed">
              <label for="closed" style="margin:0">Closed all day</label>
            </div>
            <div class="row-2" id="hours-fields">
              <div class="field"><label>Open (24h)</label><input name="open" type="number" min="0" max="23" value="9"></div>
              <div class="field"><label>Close (24h)</label><input name="close" type="number" min="1" max="23" value="18"></div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Save</button>
          </form>
        </div>
      `;
      const form = document.getElementById("avail-form");
      const closedBox = document.getElementById("closed");
      const hoursFields = document.getElementById("hours-fields");
      closedBox.addEventListener("change", () => {
        hoursFields.style.display = closedBox.checked ? "none" : "grid";
      });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const date = form.date.value;
        if (!date) return;
        const data = closedBox.checked
          ? { closed: true }
          : { closed: false, open: parseInt(form.open.value, 10), close: parseInt(form.close.value, 10) };
        try {
          await setDoc(doc(db, "availability", date), { ...data, updatedAt: serverTimestamp() }, { merge: true });
          document.getElementById("avail-alert").innerHTML = `<div class="alert alert-success">Saved.</div>`;
        } catch (err) {
          document.getElementById("avail-alert").innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        }
      });
    }

    // ---------- SITE CONTENT ----------
    async function renderSite() {
      tabContent.innerHTML = `<div class="center-spinner"><div class="spinner"></div></div>`;
      const content = await getSiteContent();

      tabContent.innerHTML = `
        <p style="margin:0 0 16px">
          Edit any text or image that appears on the homepage and footer.
          Changes go live the next time visitors load the page.
        </p>
        <div id="site-alert"></div>

        <form id="site-form">
          <div class="site-section">
            <h3>Brand</h3>
            <div class="row-2">
              <div class="field"><label>Business name</label><input name="brandName" value="${escapeHtml(content.brandName)}"></div>
              <div class="field"><label>Tagline (after name)</label><input name="brandTagline" value="${escapeHtml(content.brandTagline)}"></div>
            </div>
          </div>

          <div class="site-section">
            <h3>Hero</h3>
            <div class="field"><label>Eyebrow text</label><input name="hero.eyebrow" value="${escapeHtml(content.hero.eyebrow)}"></div>
            <div class="field"><label>Headline (use a blank line for line break)</label><textarea name="hero.headline">${escapeHtml(content.hero.headline)}</textarea></div>
            <div class="field"><label>Lead paragraph</label><textarea name="hero.lead">${escapeHtml(content.hero.lead)}</textarea></div>
            <div class="row-2">
              <div class="field"><label>Primary button label</label><input name="hero.primaryCtaLabel" value="${escapeHtml(content.hero.primaryCtaLabel)}"></div>
              <div class="field"><label>Secondary button label</label><input name="hero.secondaryCtaLabel" value="${escapeHtml(content.hero.secondaryCtaLabel)}"></div>
            </div>
            <div class="field">
              <label>Hero image</label>
              ${imageUploadHtml("hero", content.hero.imageUrl)}
            </div>
          </div>

          <div class="site-section">
            <h3>How it works (3 cards)</h3>
            ${content.features.map((f, i) => `
              <div class="row-2" style="margin-bottom:8px">
                <div class="field"><label>Card ${i+1} title</label><input name="features.${i}.title" value="${escapeHtml(f.title || "")}"></div>
                <div class="field"><label>Card ${i+1} body</label><input name="features.${i}.body" value="${escapeHtml(f.body || "")}"></div>
              </div>
            `).join("")}
          </div>

          <div class="site-section">
            <h3>Featured styles section</h3>
            <div class="row-2">
              <div class="field"><label>Eyebrow</label><input name="featured.eyebrow" value="${escapeHtml(content.featured.eyebrow)}"></div>
              <div class="field"><label>Heading</label><input name="featured.heading" value="${escapeHtml(content.featured.heading)}"></div>
            </div>
            <div class="field"><label>Body</label><input name="featured.body" value="${escapeHtml(content.featured.body)}"></div>
            <p style="font-size:0.85rem;color:var(--color-muted);margin:0">
              The cards under this heading come from the <strong>Styles</strong> tab — mark a style "Featured on home" to include it.
            </p>
          </div>

          <div class="site-section">
            <h3>About</h3>
            <div class="row-2">
              <div class="field"><label>Eyebrow</label><input name="about.eyebrow" value="${escapeHtml(content.about.eyebrow)}"></div>
              <div class="field"><label>Heading</label><input name="about.heading" value="${escapeHtml(content.about.heading)}"></div>
            </div>
            <div class="field"><label>Body (separate paragraphs with a blank line)</label>
              <textarea name="about.body" style="min-height:140px">${escapeHtml(content.about.body)}</textarea>
            </div>
            <div class="field"><label>Button label</label><input name="about.ctaLabel" value="${escapeHtml(content.about.ctaLabel)}"></div>
            <div class="field">
              <label>About photo</label>
              ${imageUploadHtml("about", content.about.imageUrl)}
            </div>
          </div>

          <div class="site-section">
            <h3>Testimonials</h3>
            <div class="field"><label>Heading</label><input name="testimonials.heading" value="${escapeHtml(content.testimonials.heading)}"></div>
            <div id="testimonials-list">
              ${content.testimonials.items.map((t, i) => testimonialRowHtml(t, i)).join("")}
            </div>
            <button type="button" class="btn btn-ghost small-btn" id="add-testimonial">+ Add testimonial</button>
          </div>

          <div class="site-section">
            <h3>CTA banner (bottom of homepage)</h3>
            <div class="field"><label>Heading</label><input name="cta.heading" value="${escapeHtml(content.cta.heading)}"></div>
            <div class="field"><label>Body</label><input name="cta.body" value="${escapeHtml(content.cta.body)}"></div>
            <div class="field"><label>Button label</label><input name="cta.ctaLabel" value="${escapeHtml(content.cta.ctaLabel)}"></div>
            <div class="field">
              <label>Background image (optional — overrides the gradient)</label>
              ${imageUploadHtml("cta", content.cta.imageUrl || "")}
            </div>
          </div>

          <div class="site-section">
            <h3>Contact &amp; footer</h3>
            <div class="row-2">
              <div class="field"><label>Email</label><input name="contact.email" type="email" value="${escapeHtml(content.contact.email)}"></div>
              <div class="field"><label>Phone</label><input name="contact.phone" value="${escapeHtml(content.contact.phone)}"></div>
            </div>
            <div class="field"><label>Instagram URL</label><input name="contact.instagram" value="${escapeHtml(content.contact.instagram)}"></div>
            <div class="field"><label>Footer blurb</label><textarea name="contact.footerBlurb">${escapeHtml(content.contact.footerBlurb)}</textarea></div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px">
            <button type="button" class="btn btn-ghost" id="reset-defaults" title="Restore the original copy">Reset to defaults</button>
            <button type="submit" class="btn btn-primary" id="save-site">Save changes</button>
          </div>
        </form>
      `;

      bindImagePath("hero");
      bindImagePath("about");
      bindImagePath("cta");
      bindTestimonials();

      document.getElementById("add-testimonial").addEventListener("click", () => {
        const list = document.getElementById("testimonials-list");
        const i = list.children.length;
        list.insertAdjacentHTML("beforeend", testimonialRowHtml({ text: "", who: "" }, i));
        bindTestimonialDeletes();
      });

      document.getElementById("reset-defaults").addEventListener("click", async () => {
        if (!confirm("Reset all homepage copy back to the original defaults? This deletes your customizations.")) return;
        try {
          await deleteDoc(doc(db, "site", "content"));
          invalidateSiteContentCache();
          renderSite();
        } catch (err) {
          showSiteAlert(err.message, "error");
        }
      });

      document.getElementById("site-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const payload = collectSiteForm(form);
        try {
          await setDoc(doc(db, "site", "content"), { ...payload, updatedAt: serverTimestamp() });
          invalidateSiteContentCache();
          showSiteAlert("Saved. Reload the homepage to see your changes.", "success");
        } catch (err) {
          showSiteAlert(err.message, "error");
        }
      });
    }

    function showSiteAlert(msg, type = "error") {
      const el = document.getElementById("site-alert");
      if (el) el.innerHTML = `<div class="alert alert-${type}">${escapeHtml(msg)}</div>`;
    }

    function imageUploadHtml(key, currentUrl) {
      const inputName = `${key}.imageUrl`;
      const previewSrc = currentUrl ? siteImgSrc(currentUrl) : "";
      return `
        <div class="upload-row">
          <img class="upload-thumb" id="${key}-thumb"
               src="${escapeHtml(previewSrc)}"
               style="${currentUrl ? '' : 'display:none'}"
               onerror="this.style.display='none'" alt="">
          <div style="flex:1">
            ${canUploadViaFunction()
              ? `<label class="btn btn-primary" for="${key}-file" style="text-decoration:none; cursor:pointer">
                   <span aria-hidden="true">📸</span> Choose photo
                 </label>
                 <input type="file" accept="image/*" id="${key}-file" hidden>
                 <div class="upload-status" id="${key}-status" style="margin-top:6px">
                   Pick a photo from your device. It gets committed into <code>images/site/</code> in the repo automatically.
                 </div>`
              : repoButtons("images/site")}
            <input name="${inputName}" id="${key}-url"
                   value="${escapeHtml(currentUrl || "")}"
                   placeholder="e.g. images/site/${key}.jpg"
                   style="font-size:0.92rem; margin-top:10px">
            <div class="upload-status">
              ${canUploadViaFunction()
                ? `Or type a path already inside the repo.`
                : `After committing on GitHub, paste the filename above (e.g. <code>hero.jpg</code>) and click Save.`}
            </div>
          </div>
        </div>
      `;
    }

    function bindImagePath(key) {
      const urlEl = document.getElementById(`${key}-url`);
      const thumb = document.getElementById(`${key}-thumb`);
      const fileEl = document.getElementById(`${key}-file`);
      const statusEl = document.getElementById(`${key}-status`);
      const saveBtn = document.getElementById("save-site");

      const refresh = () => {
        const v = urlEl.value.trim();
        if (!v) { thumb.style.display = "none"; return; }
        thumb.src = siteImgSrc(v);
        thumb.style.display = "block";
      };
      urlEl.addEventListener("input", refresh);

      if (fileEl) {
        fileEl.addEventListener("change", async () => {
          const file = fileEl.files?.[0];
          if (!file) return;
          statusEl.textContent = "Uploading to GitHub…";
          if (saveBtn) saveBtn.disabled = true;
          try {
            const path = await uploadImageToRepo(file, "site");
            urlEl.value = path;
            refresh();
            statusEl.innerHTML = `Committed as <code>${escapeHtml(path)}</code>. Click Save below to apply, and GitHub Pages will republish in ~1–2 min.`;
          } catch (err) {
            statusEl.textContent = `Upload failed: ${err.message}`;
          } finally {
            if (saveBtn) saveBtn.disabled = false;
            fileEl.value = "";
          }
        });
      }
    }

    function repoLinks(folder) {
      const upload = githubUploadUrl(folder);
      const browse = githubBrowseUrl(folder);
      if (!upload) {
        return `<em>Set <code>GITHUB_REPO</code> in <code>scripts/firebase-config.js</code> to enable one-click upload links.</em>`;
      }
      return `
        <a href="${upload}" target="_blank" rel="noopener">Upload a photo to GitHub →</a>
        &middot;
        <a href="${browse}" target="_blank" rel="noopener">Browse existing</a>
      `;
    }

    function repoButtons(folder) {
      const upload = githubUploadUrl(folder);
      const browse = githubBrowseUrl(folder);
      if (!upload) {
        return `
          <div class="repo-actions-empty">
            <em>Set <code>GITHUB_REPO</code> in <code>scripts/firebase-config.js</code> to enable the upload button.</em>
          </div>
        `;
      }
      return `
        <div class="repo-actions">
          <a class="btn btn-primary" href="${upload}" target="_blank" rel="noopener">
            <span aria-hidden="true">📸</span> Upload photo to GitHub
          </a>
          <a class="btn btn-ghost small-btn" href="${browse}" target="_blank" rel="noopener">
            Browse uploaded files
          </a>
        </div>
      `;
    }

    function testimonialRowHtml(t, i) {
      return `
        <div class="testimonial-row" data-row="${i}">
          <div class="row-2">
            <div class="field"><label>Quote</label><input name="testimonials.items.${i}.text" value="${escapeHtml(t.text || "")}"></div>
            <div class="field"><label>Author</label><input name="testimonials.items.${i}.who" value="${escapeHtml(t.who || "")}"></div>
          </div>
          <div style="text-align:right">
            <button type="button" class="btn btn-ghost small-btn delete-testimonial" style="color:var(--color-danger);border-color:var(--color-danger)">Remove</button>
          </div>
        </div>
      `;
    }

    function bindTestimonials() { bindTestimonialDeletes(); }
    function bindTestimonialDeletes() {
      document.querySelectorAll(".delete-testimonial").forEach(btn => {
        btn.onclick = () => {
          btn.closest(".testimonial-row").remove();
        };
      });
    }

    // Walk every form field with a dotted name like "hero.headline" or
    // "features.0.title" and rebuild a nested object suitable for Firestore.
    function collectSiteForm(form) {
      const out = JSON.parse(JSON.stringify(DEFAULT_CONTENT));
      out.features = [];
      out.testimonials = { ...DEFAULT_CONTENT.testimonials, items: [] };

      for (const el of form.elements) {
        if (!el.name) continue;
        const path = el.name.split(".");
        const value = el.type === "checkbox" ? el.checked : el.value;
        setPath(out, path, value);
      }
      out.features = compact(out.features);
      out.testimonials.items = compact(out.testimonials.items).filter(t => (t.text || "").trim());
      return out;
    }

    function setPath(obj, path, value) {
      let cur = obj;
      for (let i = 0; i < path.length - 1; i++) {
        const key = path[i];
        const nextIsIndex = /^\d+$/.test(path[i + 1]);
        if (cur[key] == null || typeof cur[key] !== "object") {
          cur[key] = nextIsIndex ? [] : {};
        }
        cur = cur[key];
      }
      const leaf = path[path.length - 1];
      cur[leaf] = typeof value === "string" ? value.trim() : value;
    }

    function compact(arr) {
      if (!Array.isArray(arr)) return [];
      return arr.filter(Boolean);
    }
  </script>
</body>
</html>
