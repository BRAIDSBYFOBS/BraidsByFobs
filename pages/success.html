<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking confirmed — Braids By Fobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css?v=2026.05.28" />
</head>
<body>
  <div id="nav-slot"></div>

  <section class="section">
    <div class="container">
      <div class="form-card" style="max-width:560px; margin:0 auto">
        <div style="text-align:center">
          <div style="width:64px;height:64px;border-radius:50%;background:#fce7f3;color:var(--color-primary);
                      display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:2rem">&#10003;</div>
          <h2 style="text-align:center;margin-bottom:8px">You're booked!</h2>
          <p style="text-align:center;color:var(--color-muted)">Your appointment is confirmed. Save the details below.</p>
        </div>

        <div id="booking-details" style="margin-top:20px;padding:16px;background:#fdf2f8;border-radius:var(--radius-sm);border:1px solid var(--color-border)">
          <p style="margin:0;color:var(--color-muted)">Loading your booking…</p>
        </div>

        <p style="font-size:0.9rem;color:var(--color-muted);margin-top:16px;text-align:center">
          Tap WhatsApp or email below so Fobs gets your booking right away — free, no payment setup needed.
        </p>

        <div id="notify-actions" style="display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap"></div>

        <div style="display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap">
          <a class="btn btn-primary" href="account.html">View my bookings</a>
          <a class="btn btn-ghost" href="../index.html">Back to home</a>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script type="module">
    import { injectNav, injectFooter, qs, whatsAppLink, mailtoLink, escapeHtml } from "../scripts/common.js";
    import { fmtMoney, fmtDuration, fmtDate, ADMIN_EMAILS } from "../scripts/firebase-config.js";
    import { getSiteContent } from "../scripts/site-content.js";

    injectNav("");
    injectFooter();

    function loadBooking() {
      const raw = sessionStorage.getItem("confirmedBooking");
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function formatWhen(iso) {
      const d = new Date(iso);
      return `${fmtDate(d)} at ${d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}`;
    }

    function buildNotifyMessage(booking, ref) {
      const c = booking.customer || {};
      const lines = [
        "Hi Fobs! New booking confirmed:",
        "",
        `Style: ${booking.styleName}`,
        `When: ${formatWhen(booking.startAt)}`,
        `Duration: ${fmtDuration(booking.durationMin)}`,
        `Price: ${fmtMoney(booking.priceCents)} (due at appointment)`,
        "",
        `Name: ${c.name || ""}`,
        `Email: ${c.email || ""}`,
        `Phone: ${c.phone || ""}`,
      ];
      if (c.notes) lines.push(`Notes: ${c.notes}`);
      lines.push("", `Ref: ${ref}`);
      return lines.join("\n");
    }

    const bookingId = qs("bookingId") || "";
    const booking = loadBooking();
    const detailsEl = document.getElementById("booking-details");
    const actionsEl = document.getElementById("notify-actions");

    if (!booking) {
      detailsEl.innerHTML = `<p style="margin:0">Booking ref: <strong>${escapeHtml(bookingId || "—")}</strong></p>`;
    } else {
      const c = booking.customer || {};
      detailsEl.innerHTML = `
        <div class="summary-row"><span>Style</span><span>${escapeHtml(booking.styleName)}</span></div>
        <div class="summary-row"><span>When</span><span>${escapeHtml(formatWhen(booking.startAt))}</span></div>
        <div class="summary-row"><span>Duration</span><span>${fmtDuration(booking.durationMin)}</span></div>
        <div class="summary-row"><span>Total</span><span>${fmtMoney(booking.priceCents)}</span></div>
        <div class="summary-row"><span>Name</span><span>${escapeHtml(c.name || "")}</span></div>
        <div class="summary-row"><span>Email</span><span>${escapeHtml(c.email || "")}</span></div>
        <div class="summary-row"><span>Phone</span><span>${escapeHtml(c.phone || "")}</span></div>
        ${c.notes ? `<div style="margin-top:10px;font-size:0.9rem"><strong>Notes:</strong> ${escapeHtml(c.notes)}</div>` : ""}
        <div style="margin-top:10px;font-size:0.82rem;color:var(--color-muted)">Ref: ${escapeHtml(bookingId || booking.id || "")}</div>
      `;
    }

    getSiteContent().then((content) => {
      if (!booking) return;
      const ref = bookingId || booking.id || "";
      const msg = buildNotifyMessage(booking, ref);
      const contact = content.contact || {};
      const adminEmail = contact.email || ADMIN_EMAILS[0] || "";
      const phone = contact.phone || "";

      const wa = whatsAppLink(phone, msg);
      const mail = mailtoLink(
        adminEmail,
        `New booking: ${booking.styleName} — ${formatWhen(booking.startAt)}`,
        msg
      );

      if (wa) {
        actionsEl.innerHTML += `
          <a class="btn btn-primary" id="wa-btn" href="${wa}" target="_blank" rel="noopener">
            Message on WhatsApp
          </a>`;
      }
      if (mail) {
        actionsEl.innerHTML += `
          <a class="btn btn-ghost" href="${mail}">
            Email Fobs
          </a>`;
      }
      if (!wa && !mail) {
        actionsEl.innerHTML = `<p style="font-size:0.88rem;color:var(--color-muted);margin:0">Contact info not set yet — Fobs will reach out using the details you provided.</p>`;
      }
    });
  </script>
</body>
</html>
