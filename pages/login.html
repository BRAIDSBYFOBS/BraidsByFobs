<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Braids By Fobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css?v=2026.05.28.2" />
</head>
<body>
  <div id="nav-slot"></div>

  <section class="section">
    <div class="container">
      <div class="form-card">
        <h2>Welcome back</h2>
        <p class="sub">Log in to see your bookings.</p>

        <div id="alert-slot"></div>

        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary btn-block" id="submit-btn" type="submit">Log in</button>
        </form>

        <div class="divider">or</div>
        <button id="google-btn" class="btn btn-ghost btn-block" type="button">Continue with Google</button>

        <p style="text-align:center; margin-top:18px; font-size:0.92rem">
          New here? <a href="signup.html">Create an account</a>
        </p>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script type="module">
    import { injectNav, injectFooter, showAlert, qs } from "../scripts/common.js";
    import {
      auth, signInWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup
    } from "../scripts/firebase-config.js";

    injectNav("login");
    injectFooter();

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const googleBtn = document.getElementById("google-btn");
    const alertSlot = document.getElementById("alert-slot");

    function afterAuth() {
      const next = qs("next");
      window.location.href = next ? decodeURIComponent(next) : "account.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";
      try {
        await signInWithEmailAndPassword(auth, form.email.value.trim(), form.password.value);
        afterAuth();
      } catch (err) {
        showAlert(alertSlot, err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });

    googleBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
        afterAuth();
      } catch (err) {
        showAlert(alertSlot, err.message);
      }
    });
  </script>
</body>
</html>
